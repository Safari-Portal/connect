openapi: 3.0.3
info:
  title: Safari Portal Connect API
  version: 1.0.0
  description: >
    Machine-readable contract for the Safari Portal Connect API. See the narrative
    documentation in README.md for the auth flow, conventions, and per-resource prose.
    All resource ids are opaque strings.
servers:
  - url: https://connect.safariportal.dev
    description: Production
paths:
  /accounts:
    get:
      operationId: listAccounts
      summary: List the agent accounts the token can act on
      security:
        - oauth2: []
      responses:
        "200":
          description: The accessible accounts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
  /acc/{acc_id}/contacts:
    get:
      operationId: listContacts
      summary: List the account's contacts (all types)
      security:
        - oauth2: [contacts:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/BirthdayWindow"
        - $ref: "#/components/parameters/AnniversaryWindow"
        - $ref: "#/components/parameters/ContactCountryCodes"
        - $ref: "#/components/parameters/ContactCities"
        - $ref: "#/components/parameters/ContactLeadSources"
        - $ref: "#/components/parameters/ContactOwnerIds"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/ContactList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createContact
      summary: Create a contact
      security:
        - oauth2: [contacts:write]
      parameters:
        - $ref: "#/components/parameters/AccId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactWrite"
      responses:
        "201":
          $ref: "#/components/responses/ContactWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /acc/{acc_id}/itineraries:
    get:
      operationId: listItineraries
      summary: List the account's published itineraries, optionally filtered by country
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - $ref: "#/components/parameters/CountryCodes"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/ItineraryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/lookbooks:
    get:
      operationId: listLookbooks
      summary: List the account's published lookbooks, optionally filtered by country
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - $ref: "#/components/parameters/CountryCodes"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/LookbookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/contacts/{id}:
    get:
      operationId: getContact
      summary: Retrieve a single contact
      security:
        - oauth2: [contacts:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ContactShow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateContact
      summary: Update a contact
      security:
        - oauth2: [contacts:write]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactWrite"
      responses:
        "200":
          $ref: "#/components/responses/ContactWriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteContact
      summary: Delete a contact
      description: >-
        Permanently deletes the contact. Partners and suppliers need the member's permission to
        manage them, and a member restricted to their own contacts can delete only those. A contact who is the sole recipient of an invoice with payments cannot be
        deleted (409).
      security:
        - oauth2: [contacts:delete]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /acc/{acc_id}/forms:
    get:
      operationId: listForms
      summary: List the account's forms (metadata only)
      security:
        - oauth2: [forms:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of forms
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Form"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                required:
                  - data
                  - meta
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/forms/{id}:
    get:
      operationId: getForm
      summary: Retrieve a single form (metadata only)
      security:
        - oauth2: [forms:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The form
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Form"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/forms/{form_id}/submissions:
    get:
      operationId: listFormSubmissions
      summary: List a form's submissions
      security:
        - oauth2: [forms:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: form_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubmissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/contacts/{contact_id}/form_submissions:
    get:
      operationId: listContactFormSubmissions
      summary: List a contact's form submissions
      security:
        - oauth2: [forms:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: contact_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubmissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/form_submissions/{id}:
    get:
      operationId: getFormSubmission
      summary: Retrieve a single form submission
      security:
        - oauth2: [forms:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The submission
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Submission"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/files:
    get:
      operationId: listFiles
      summary: List the account's files
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/FileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createFile
      summary: Create a file (as a lead)
      security:
        - oauth2: [files:write]
      parameters:
        - $ref: "#/components/parameters/AccId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileWrite"
      responses:
        "201":
          $ref: "#/components/responses/FileWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /acc/{acc_id}/files/{id}:
    get:
      operationId: getFile
      summary: Retrieve a single file
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/FileShow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFile
      summary: Update a file
      security:
        - oauth2: [files:write]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileWrite"
      responses:
        "200":
          $ref: "#/components/responses/FileWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteFile
      summary: Delete a file
      description: >-
        Soft-deletes the file with its itineraries, lookbooks, guest portals and proposals. It can
        be restored in Safari Portal from Recently Deleted during the retention period. A file
        with pending or paid payments cannot be deleted (409).
      security:
        - oauth2: [files:delete]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /acc/{acc_id}/files/{file_id}/events:
    get:
      operationId: listFileEvents
      summary: List a file's events
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: file_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/EventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/files/{file_id}/notes:
    get:
      operationId: listFileNotes
      summary: List a file's notes
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: file_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/FileNoteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createFileNote
      summary: Add a note to a file
      description: >-
        The note is authored by the member the token belongs to.
      security:
        - oauth2: [files:write]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileNoteWrite"
      responses:
        "201":
          $ref: "#/components/responses/FileNoteWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /acc/{acc_id}/files/{file_id}/notes/{id}:
    get:
      operationId: getFileNote
      summary: Retrieve a single file note
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: file_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/FileNoteShow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/files/{file_id}/itineraries:
    get:
      operationId: listFileItineraries
      summary: List a file's itineraries (metadata only)
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: file_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/ItineraryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/files/{file_id}/itineraries/{id}:
    get:
      operationId: getFileItinerary
      summary: Retrieve a single itinerary (metadata only)
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: file_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ItineraryShow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/files/{file_id}/lookbooks:
    get:
      operationId: listFileLookbooks
      summary: List a file's lookbooks (metadata only)
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: file_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/LookbookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/files/{file_id}/lookbooks/{id}:
    get:
      operationId: getFileLookbook
      summary: Retrieve a single lookbook (metadata only)
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: file_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/LookbookShow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/contact_custom_fields:
    get:
      operationId: listContactCustomFields
      summary: List the account's traveler custom fields
      description: >
        The custom fields the account added to its Traveler contacts, in the order the contact
        profile shows them. Use the handles and options here to write values through
        `custom_fields` on createContact and updateContact.
      security:
        - oauth2: [contacts:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
      responses:
        "200":
          description: The custom fields, in profile display order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactCustomField"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/file_sources:
    get:
      operationId: listFileSources
      summary: List the account's file sources
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
      responses:
        "200":
          description: The sources, position-ordered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileReference"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/file_trip_types:
    get:
      operationId: listFileTripTypes
      summary: List the account's file trip types
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
      responses:
        "200":
          description: The trip types, position-ordered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileReference"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/file_travel_regions:
    get:
      operationId: listFileTravelRegions
      summary: List the account's file travel regions
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
      responses:
        "200":
          description: The travel regions, position-ordered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileReference"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/file_channels:
    get:
      operationId: listFileChannels
      summary: List the built-in file channel values
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
      responses:
        "200":
          description: The channel values a file's `channel` field can carry
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: string
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/file_stages:
    get:
      operationId: listFileStages
      summary: List the account's file stages
      security:
        - oauth2: [files:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - name: pipeline
          in: query
          required: false
          description: Filter to a single pipeline.
          schema:
            type: string
      responses:
        "200":
          description: The stages
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileStage"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /acc/{acc_id}/tasks:
    get:
      operationId: listTasks
      summary: List the account's tasks
      security:
        - oauth2: [tasks:read]
      parameters:
        - $ref: "#/components/parameters/AccId"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTask
      summary: Create a task on a file
      description: >-
        file_id, name and due_date are required. due_date is YYYY-MM-DD.


        assigned_to_id is absent from the example body on purpose: it defaults to the
        member the token belongs to, and that default is keyed on the field being
        ABSENT, not blank. Adding it back as "" is a 422, not the default. Add it only
        with a real user id.
      security:
        - oauth2: [tasks:write]
      parameters:
        - $ref: "#/components/parameters/AccId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskWrite"
      responses:
        "201":
          $ref: "#/components/responses/TaskWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /acc/{acc_id}/tasks/{id}:
