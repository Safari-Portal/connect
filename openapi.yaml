components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authorization code flow with PKCE.
      flows:
        authorizationCode:
          authorizationUrl: https://account.safariportal.app/oauth/authorize
          tokenUrl: https://connect.safariportal.dev/oauth/token
          scopes:
            files:read: Read files and their events, notes, categories, and stages
            files:write: Create and update files, and add notes to them
            files:delete: Delete files
            contacts:read: Read contacts
            contacts:write: Create and update contacts
            contacts:delete: Delete contacts
            tasks:read: Read tasks
            tasks:write: Create tasks
            users:read: Read account users
            financials:read: Read invoices and expenses
            forms:read: Read forms and their submissions
  parameters:
    AccId:
      name: acc_id
      in: path
      required: true
      description: Account id the token is bound to.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
    Q:
      name: q
      in: query
      required: false
      description: Free-text search query.
      schema:
        type: string
    Order:
      name: order
      in: query
      required: false
      description: Sort order token.
      schema:
        type: string
    Scope:
      name: scope
      in: query
      required: false
      description: Named filter scope.
      schema:
        type: string
    BirthdayWindow:
      name: birthday_window
      in: query
      required: false
      description: >
        Filter to contacts whose birthday falls in a named window. `next_7_days` counts seven
        days from today inclusive; `this_week` and `next_week` are Monday-to-Sunday. Travelers
        only — combining with a non-traveler `scope` is a 400. Combining with
        `anniversary_window` intersects.
      schema:
        type: string
        enum: [next_7_days, this_week, next_week]
    AnniversaryWindow:
      name: anniversary_window
      in: query
      required: false
      description: >
        Filter to contacts whose anniversary falls in a named window, same vocabulary as
        `birthday_window`. Travelers only — combining with a non-traveler `scope` is a 400.
        Combining with `birthday_window` intersects.
      schema:
        type: string
        enum: [next_7_days, this_week, next_week]
    CountryCodes:
      name: country_codes
      in: query
      required: false
      description: Filter to proposals whose published snapshot contains any of these ISO 3166-1 alpha-2 country codes (case-insensitive, e.g. `KE`). Comma-separated.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    ContactCountryCodes:
      name: "country_codes[]"
      in: query
      required: false
      description: >
        Filter to contacts whose primary address is in any of these ISO 3166-1 alpha-2 country
        codes (case-insensitive, e.g. `KE`). Repeat the parameter for multiple values. An
        unrecognized code is rejected with a 400.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    ContactLeadSources:
      name: "original_lead_sources[]"
      in: query
      required: false
      description: >
        Filter to contacts whose original lead source is any of the given values. Values are the
        account's file source names (`Digital Ads (PPC)`), matched exactly. The legacy keys
        (`referral`, `digital_ads`, …) and old labels (`Digital ads (PPC)`) are accepted as
        aliases for the default source names.
        Repeat the parameter for multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    ContactOwnerIds:
      name: "owner_ids[]"
      in: query
      required: false
      description: >
        Filter to contacts owned by any of these member ids (a contact matches through any of
        its owners, not only the primary one). The literal `none` matches contacts that have no
        owner; combined with member ids the result is the union. Repeat the parameter for
        multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    ContactCities:
      name: "cities[]"
      in: query
      required: false
      description: >
        Filter to contacts whose primary address city matches any of these, case-insensitively.
        Exact match, not a prefix search. Repeat the parameter for multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The token lacks the required scope or is bound to another account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The resource does not exist or is not visible to this token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The record's current state forbids the request (`description` says why)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: >-
        Malformed request — a query parameter the endpoint cannot interpret, or a write body
        carrying nothing the resource envelope recognises. A write body is NOT required to
        carry the envelope key itself: a top-level key matching a column of the resource is
        folded into the envelope and validated normally (422).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TaskList:
      description: A page of tasks
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
              meta:
                $ref: "#/components/schemas/PaginationMeta"
            required:
              - data
              - meta
    UserList:
      description: A page of team members
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/User"
              meta:
                $ref: "#/components/schemas/PaginationMeta"
            required:
              - data
              - meta
    InvoiceList:
      description: A page of invoices
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
              meta:
                $ref: "#/components/schemas/PaginationMeta"
            required:
              - data
              - meta
    ExpenseList:
      description: A page of expenses
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
              meta:
                $ref: "#/components/schemas/PaginationMeta"
            required:
              - data
              - meta
    FileShow:
      description: The file
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                $ref: "#/components/schemas/FileDetail"
            required:
              - data
    ContactWriteResult:
      description: >
        The contact. Full representation for a token holding `contacts:read`; otherwise just
        the id, since echoing the record back is a read.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                oneOf:
                  - $ref: "#/components/schemas/Contact"
                  - $ref: "#/components/schemas/ResourceIdentity"
            required:
              - data
    TaskWriteResult:
      description: >
        The task. Full representation for a token holding `tasks:read`; otherwise just the id,
        since echoing the record back is a read.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                oneOf:
