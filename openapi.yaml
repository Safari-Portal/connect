        trip_leaders:
          type: array
          description: >
            Trip leader contacts on the file, as {id, name} references — resolve full
            records via the contacts endpoint. Names carry the company in parentheses when the contact has one.
          items:
            $ref: "#/components/schemas/FileReference"
        suppliers:
          type: array
          description: >
            Supplier contacts on the file, as {id, name} references — resolve full
            records via the contacts endpoint. Names carry the company in parentheses when the contact has one.
          items:
            $ref: "#/components/schemas/FileReference"
        tags:
          type: array
          items:
            type: string
        travelers:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        start_date:
          type: string
          nullable: true
        end_date:
          type: string
          nullable: true
        estimated_start_date:
          type: string
          nullable: true
          description: The planned trip start the team entered while organizing the file, or null. It is kept (and stays editable) after confirmation; the confirmed trip's dates are start_date and end_date.
        estimated_end_date:
          type: string
          nullable: true
          description: The planned trip end the team entered while organizing the file, or null. Kept after confirmation, like estimated_start_date.
        created_at:
          type: string
        confirmed_at:
          type: string
          nullable: true
        updated_at:
          type: string
      required:
