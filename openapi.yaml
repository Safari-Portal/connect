      properties:
        id:
          type: string
      required:
        - id
    ContactWrite:
      type: object
      description: Request body for creating or updating a contact.
      properties:
        contact:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            middle_name:
              type: string
            preferred_name:
              type: string
            title:
              type: string
            email:
              type: string
            alternative_email:
              type: string
