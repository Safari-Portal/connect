          type: string
          enum:
            - na
            - low
            - medium
            - high
            - top
        stage_id:
          type: string
          nullable: true
        source:
          type: object
          nullable: true
          description: The category recording how the trip was won, or null.
          additionalProperties: false
          properties:
            id:
              type: string
            name:
              type: string
          required:
            - id
            - name
        trip_type:
          type: object
          nullable: true
          description: The category recording the kind of trip, or null.
          additionalProperties: false
          properties:
            id:
              type: string
            name:
              type: string
          required:
            - id
            - name
        travel_region:
          type: object
          nullable: true
          description: The category recording the destination region, or null.
          additionalProperties: false
          properties:
            id:
              type: string
            name:
              type: string
          required:
            - id
            - name
        license_type:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true
        consultant_id:
          type: string
          nullable: true
        sales_consultants:
          type: array
          description: >
            Team members (users) assigned as sales consultants, as {id, name} references —
            resolve full records via the users endpoint.
          items:
            $ref: "#/components/schemas/FileReference"
        partner_agents:
          type: array
          description: >
            Partner agent contacts on the file, as {id, name} references — resolve full
            records via the contacts endpoint. Names carry the company in parentheses when the contact has one.
          items:
