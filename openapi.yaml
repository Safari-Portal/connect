              type: string
            alternative_phone:
              type: string
            date_of_birth:
              type: string
            anniversary_date:
              type: string
            known_traveler_number:
              type: string
            gender:
              type: string
            nationality:
              type: string
            nationality_country_code:
              type: string
              description: ISO 3166-1 alpha-2 country code, e.g. "BR". Takes precedence over `nationality` when both are sent.
            medical_issues:
              type: string
            dietary_preferences:
              type: string
            referred_by_id:
              type: string
            tags:
              type: array
              description: Tags to apply, matching what reads return.
              items:
                type: string
            emergency_contacts_attributes:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  phone:
                    type: string
            custom_fields:
              type: array
              example: []
              description: >
                Custom field values to set, travelers only. Fields left out keep their value;
                null, "" or [] clears one. Dates are YYYY-MM-DD, select values must be one of
                the field's options, and a multi-select field takes a list. Any invalid entry
                rejects the whole request with 422. Needs a plan that includes custom profile
                fields (403 otherwise).
              items:
                type: object
                properties:
                  handle:
                    type: string
                    description: The custom field handle, from listContactCustomFields.
                  value:
                    oneOf:
                      - type: string
                        nullable: true
                      - type: array
                        items:
                          type: string
                required:
                  - handle
                  - value
      required:
        - contact
    TaskWrite:
      type: object
      description: Request body for creating a task.
      # The example drives the generated Bruno template. assigned_to_id is deliberately
      # absent — see the createTask operation description.
      example:
        task:
          file_id: ""
          name: ""
          due_date: ""
          note: ""
          types: []
          tags: []
      properties:
        task:
          type: object
          properties:
