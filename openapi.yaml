    LookbookList:
      description: A page of lookbooks
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/Lookbook"
              meta:
                $ref: "#/components/schemas/PaginationMeta"
            required:
              - data
              - meta
    ContactShow:
      description: The contact
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                $ref: "#/components/schemas/Contact"
            required:
              - data
    ContactList:
      description: A page of contacts
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
              meta:
                $ref: "#/components/schemas/PaginationMeta"
            required:
              - data
              - meta
    SubmissionList:
      description: A page of submissions
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
              meta:
                $ref: "#/components/schemas/PaginationMeta"
            required:
              - data
              - meta
  schemas:
    PaginationMeta:
      type: object
      additionalProperties: false
      properties:
        total_count:
          type: integer
        total_pages:
          type: integer
        current_page:
          type: integer
        current_count:
          type: integer
        next_page:
          type: integer
          nullable: true
        prev_page:
          type: integer
          nullable: true
        first_page:
          type: boolean
        last_page:
          type: boolean
        out_of_range:
          type: boolean
      required:
        - total_count
        - total_pages
        - current_page
        - current_count
        - next_page
        - prev_page
        - first_page
        - last_page
        - out_of_range
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        errors:
          type: object
          additionalProperties: false
          properties:
            status:
              type: integer
            title:
              type: string
            description:
              type: string
            source:
              type: string
          required:
            - status
            - title
      required:
        - errors
    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
      required:
        - id
        - name
        - created_at
    Contact:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        middle_name:
          type: string
          nullable: true
        preferred_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        alternative_email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        alternative_phone:
          type: string
          nullable: true
        company_name:
          type: string
          nullable: true
        referred_by:
          type: object
          nullable: true
          description: The contact who referred this one, or null.
          additionalProperties: false
          properties:
            id:
              type: string
            display_name:
              type: string
              nullable: true
          required:
            - id
            - display_name
        type:
          type: string
          enum:
            - partner
            - supplier
            - traveler
        tags:
          type: array
          items:
            type: string
        city:
          type: string
          nullable: true
          description: City of the contact's primary address.
        state_code:
          type: string
          nullable: true
          description: ISO 3166-2 subdivision code of the primary address.
        country_code:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code of the primary address.
        country_name:
          type: string
          nullable: true
          description: Country name of the primary address.
        dob:
          type: string
          nullable: true
          description: Date of birth, ISO 8601 (YYYY-MM-DD).
        anniversary:
          type: string
          nullable: true
          description: Anniversary date, ISO 8601 (YYYY-MM-DD).
        medical_issues:
          type: string
          nullable: true
        dietary_preferences:
          type: string
          nullable: true
        custom_fields:
          type: array
          description: >
            Every custom field of the account with this contact's value, in profile display order.
            Travelers only: the key is absent on partners and suppliers.
          items:
            $ref: "#/components/schemas/ContactCustomFieldValue"
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - first_name
        - last_name
        - middle_name
        - preferred_name
        - email
        - alternative_email
        - phone
        - alternative_phone
        - company_name
        - referred_by
        - type
        - tags
        - city
        - state_code
        - country_code
        - country_name
        - dob
        - anniversary
        - medical_issues
        - dietary_preferences
        - created_at
        - updated_at
    ContactCustomFieldValue:
      type: object
      additionalProperties: false
      properties:
        handle:
          type: string
          description: The custom field handle, as listed by listContactCustomFields.
        name:
          type: string
        type:
          type: string
          enum: [text, date, select]
        category:
          type: string
          enum: [personal_information, general, health_dietary, preferences]
        value:
          description: >
            A string for text and single-select fields, a YYYY-MM-DD string for date fields, and
            a list of options for multi-select fields (empty when none is chosen). Null when not
            recorded.
          oneOf:
            - type: string
              nullable: true
            - type: array
              items:
                type: string
      required:
        - handle
        - name
        - type
        - category
        - value
    ContactCustomField:
      type: object
      additionalProperties: false
      properties:
        handle:
          type: string
          description: Stable identifier derived from the name when the field is created, e.g. "wedding_date". Unique in the account and unchanged by a rename.
        name:
          type: string
        type:
          type: string
          enum: [text, date, select]
        category:
          type: string
          enum: [personal_information, general, health_dietary, preferences]
        multi_select:
          type: boolean
          description: True when a select field takes several options.
        options:
          type: array
          description: The allowed values of a select field. Empty for text and date fields.
          items:
            type: string
      required:
        - handle
        - name
        - type
        - category
        - multi_select
        - options
    ResourceIdentity:
      type: object
      description: >
        The identity of a record a write endpoint just created or updated. Returned in place of
        the full resource when the token holds the resource's `:write` scope but not its
        `:read` scope — echoing the record back is a read, so a write-only grant receives only
        what it needs to reference what it wrote.
