    FileDetail:
      type: object
      description: >
        A single file, as returned by the show, create, and update endpoints. Identical to File
        plus the four role reference lists (`sales_consultants`, `partner_agents`,
        `trip_leaders`, `suppliers`) and the expanded `travelers` array, which is present only
        when the token holds `contacts:read`, since it carries contact data rather than file
        data. It replaces the `traveler_ids` list that these endpoints used to return; ids are
        still accepted on write, and remain the way to set a file's travelers.


        Deliberately spells out File's fields again rather than composing with `allOf`:
        `additionalProperties: false` is evaluated per subschema, so an `allOf` of File plus
        travelers would reject every File field. Keep the duplication — the two are kept honest
        by conformance tests on both the list and show responses.
